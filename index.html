<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>متابعة الحوت — ورقي فقط</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>body{font-family:'IBM Plex Sans Arabic',sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:16px}h1{font-size:20px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.c{background:#161b22;border-radius:10px;padding:12px}.k{color:#8b949e;font-size:13px}.v{font-size:19px;font-weight:600;direction:ltr;text-align:right}.up{color:#3fb950}.dn{color:#f85149}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}td,th{padding:4px;border-bottom:1px solid #30363d;text-align:right}.n{direction:ltr}.warn{background:#3b2300;padding:8px;border-radius:8px}</style></head><body>
<h1>🐋 متابعة الحوت على هايبرليكويد — <span style="color:#f0b429">ورقي بس، ما فيه فلوس حقيقية</span></h1>
<div class="k" id="u"></div><div class="k n" id="w"></div>
<h3>وضع الحوت الحين</h3><div class="g" id="g1"></div>
<h3>الأرقام بصراحة</h3><div class="g" id="g2"></div>
<h3>نسخة ورقية ($1000، رافعة ماكس 3x، تأخير 5 ثواني + انزلاق ورسوم)</h3><div class="g" id="g3"></div>
<h3>تنبيهات (تنكتب في ملف بس)</h3><div id="al" class="warn"></div>
<h3>آخر صفقات الحوت</h3><table id="tf"></table>
<h3>سجل النسخة الورقية</h3><table id="tp"></table>
<h3>الإيداعات والسحوبات</h3><table id="tl"></table>
<script>
const f=(x,d=0)=>x==null?'—':Number(x).toLocaleString('en-US',{maximumFractionDigits:d});const T=t=>new Date(t*1000).toLocaleString('ar-SA',{timeZone:'Asia/Riyadh'});
const c=(k,v,cl='')=>`<div class="c"><div class="k">${k}</div><div class="v ${cl}">${v}</div></div>`;const s=x=>x>=0?'up':'dn';
async function go(){const d=await (await fetch('state.json?'+Date.now())).json();const p=d.paper;
u.textContent='آخر تحديث: '+T(d.updated)+' (بتوقيت الرياض)';w.textContent=d.wallet;
g1.innerHTML=c('سعر ETH','$'+f(d.mark,1))+c('حجم المركز (ETH)',f(d.szi,2))+c('قيمة المركز','$'+f(d.ntl))+c('سعر الدخول','$'+f(d.entry,1))+c('ربح/خسارة مفتوحة','$'+f(d.upnl),s(d.upnl))+c('رصيد الحساب','$'+f(d.acct))+c('سعر التصفية','$'+f(d.liq,0),'dn')+c('بعده عن التصفية',f(d.dist_liq,1)+'%',d.dist_liq<10?'dn':'')+c('الرافعة الفعلية',f(d.eff_lev,2)+'x');
g2.innerHTML=c('ربح محقق من الصفقات المسكّرة (آخر 2000 صفقة)','$'+f(d.realized_fills),s(d.realized_fills))+c('الرسوم المدفوعة','$'+f(d.fees_fills))+c('نسبة الفوز (المسكّرة بس)',f(d.winrate,1)+'% من '+d.closed_fills)+c('نسبة الفوز مع المفتوح',f(d.mtm_winrate,1)+'%')+c('الإجمالي (محقق+مفتوح−رسوم)','$'+f(d.mtm_total),s(d.mtm_total))+c('ربح كل الوقت (من المنصة)','$'+f(d.alltime_pnl),s(d.alltime_pnl))+c('أكبر هبوط بالرصيد (كل الوقت)',f(d.mdd_alltime,1)+'%','dn')+c('أكبر هبوط من بدينا نتابع',f(d.mdd_tracked,1)+'%','dn');
g3.innerHTML=c('رصيد النسخة','$'+f(p.equity,2),s(p.equity-p.start))+c('الربح/الخسارة',f((p.equity/p.start-1)*100,2)+'%',s(p.equity-p.start))+c('المركز (ETH)',f(p.pos,4))+c('سعر الدخول','$'+f(p.entry,1))+c('سعر تصفية النسخة','$'+f(p.liq_px,0),'dn')+c('رسوم','$'+f(p.fees,2))+c('أكبر هبوط',f(p.mdd,1)+'%')+c('انصفّت؟',p.liquidated?'إيه 💀':'لا');
al.innerHTML=d.alerts.length?d.alerts.map(x=>`<div class="n">${x}</div>`).join(''):'ما فيه تنبيهات للحين';
tf.innerHTML='<tr><th>الوقت</th><th>النوع</th><th>الكمية</th><th>السعر</th></tr>'+d.fills.map(r=>`<tr><td>${T(r[0])}</td><td>${r[1]}</td><td class=n>${f(r[2],2)}</td><td class=n>${f(r[3],1)}</td></tr>`).join('');
tp.innerHTML='<tr><th>الوقت</th><th>الحدث</th><th>السعر</th><th>الكمية</th><th>الرصيد</th><th>ملاحظة</th></tr>'+p.log.map(r=>`<tr><td>${T(r[0])}</td><td>${r[1]}</td><td class=n>${f(r[2],1)}</td><td class=n>${f(r[3],4)}</td><td class=n>${f(r[5],2)}</td><td class=n>${r[6]}</td></tr>`).join('');
tl.innerHTML='<tr><th>النوع</th><th>المجموع $</th><th>العدد</th></tr>'+d.ledger.map(r=>`<tr><td>${r[0]}</td><td class=n>${f(r[1])}</td><td>${r[2]}</td></tr>`).join('');}
go();setInterval(go,30000);</script></body></html>
